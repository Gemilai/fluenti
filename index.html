<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluentify - Modern AI Translator</title>

    <meta name="theme-color" content="#1e293b">
    <meta name="description" content="Translate text, images, and PDF documents with a modern, fast, and user-friendly interface powered by Google AI.">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+Mono&display=swap" rel="stylesheet">

    <style type="text/css">
        /* ========================================
           CLASSIC THEME - PROFESSIONAL & ELEGANT
           ======================================== */

        :root {
            /* Classic Theme Colors */
            --classic-primary: #3b82f6;
            --classic-primary-dark: #2563eb;
            --classic-secondary: #8b5cf6;
            --classic-accent: #06b6d4;
            --classic-success: #10b981;
            --classic-warning: #f59e0b;
            --classic-danger: #ef4444;

            /* Light Mode */
            --classic-bg-primary: #ffffff;
            --classic-bg-secondary: #f8fafc;
            --classic-bg-tertiary: #f1f5f9;
            --classic-text-primary: #0f172a;
            --classic-text-secondary: #475569;
            --classic-text-muted: #94a3b8;
            --classic-border: #e2e8f0;
            --classic-border-hover: #cbd5e1;
            --classic-shadow: rgba(0, 0, 0, 0.1);
            --classic-shadow-lg: rgba(0, 0, 0, 0.15);
        }

        /* Classic Dark Mode */
        .dark {
            --classic-bg-primary: #1e293b;
            --classic-bg-secondary: #0f172a;
            --classic-bg-tertiary: #334155;
            --classic-text-primary: #f1f5f9;
            --classic-text-secondary: #cbd5e1;
            --classic-text-muted: #94a3b8;
            --classic-border: #334155;
            --classic-border-hover: #475569;
        }

        /* Base styles - Classic Theme */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--classic-bg-secondary) 0%, var(--classic-bg-tertiary) 100%);
            color: var(--classic-text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        /* Custom Scrollbar - Classic */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--classic-bg-secondary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--classic-primary), var(--classic-secondary));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--classic-primary-dark), #7c3aed);
        }

        /* Main Container - Classic */
        #app-container {
            background: var(--classic-bg-primary);
            border: 1px solid var(--classic-border);
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px var(--classic-shadow-lg), 0 0 0 1px rgba(255,255,255,0.1) inset;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--classic-primary), var(--classic-secondary), var(--classic-accent));
        }

        /* Header - Classic */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--classic-border);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--classic-primary), var(--classic-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Buttons - Classic */
        button, select, input[type="submit"] {
            font-family: inherit;
            transition: all 0.2s ease;
        }

        #translate-btn, .btn-primary {
            background: linear-gradient(135deg, var(--classic-primary), var(--classic-secondary));
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        #translate-btn:hover, .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        #translate-btn:active {
            transform: translateY(0);
        }

        /* Form Inputs - Classic */
        input, select, textarea {
            background: var(--classic-bg-secondary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-primary);
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--classic-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--classic-bg-primary);
        }

        /* Desktop Tabs - Classic */
        #desktop-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--classic-bg-secondary);
            padding: 0.5rem;
            border-radius: 1rem;
            border: 1px solid var(--classic-border);
        }

        .desktop-tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: none;
            background: transparent;
            color: var(--classic-text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .desktop-tab-btn:hover {
            color: var(--classic-text-primary);
            background: var(--classic-bg-tertiary);
        }

        .desktop-tab-btn.active {
            background: linear-gradient(135deg, var(--classic-primary), var(--classic-secondary));
            color: white;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
        }

        /* Swap Button - Classic */
        #swap-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--classic-bg-secondary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #swap-btn:hover {
            background: var(--classic-primary);
            border-color: var(--classic-primary);
            color: white;
            transform: rotate(180deg);
        }

        /* Output Section - Classic */
        #output {
            background: var(--classic-bg-secondary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-primary);
            border-radius: 0.75rem;
        }

        /* Enhancement Toolbar - Classic */
        #enhancements-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem;
            background: var(--classic-bg-secondary);
            border-radius: 0.75rem;
            margin-top: 1rem;
            border: 1px solid var(--classic-border);
        }

        .enhancement-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--classic-bg-primary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .enhancement-btn:hover {
            border-color: var(--classic-primary);
            color: var(--classic-primary);
        }

        /* Progress Bar - Classic */
        .progress-bar {
            height: 8px;
            background: var(--classic-bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-inner, #progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--classic-primary), var(--classic-secondary));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Settings Panel - Classic */
        #settings-view .form-group {
            margin-bottom: 1.5rem;
        }

        #settings-view label {
            display: block;
            font-weight: 600;
            color: var(--classic-text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        /* Mobile Navigation - Classic */
        #mobile-nav {
            background: var(--classic-bg-primary);
            border-top: 1px solid var(--classic-border);
            box-shadow: 0 -4px 20px var(--classic-shadow);
        }

        .mobile-nav-btn {
            color: var(--classic-text-secondary);
            transition: all 0.2s ease;
        }

        .mobile-nav-btn.active {
            color: var(--classic-primary);
        }

        /* Control Buttons - Classic */
        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--classic-bg-secondary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--classic-primary);
            color: var(--classic-primary);
        }

        #theme-toggle, #settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--classic-bg-secondary);
            border: 1px solid var(--classic-border);
            color: var(--classic-text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #theme-toggle:hover, #settings-btn:hover {
            border-color: var(--classic-primary);
            color: var(--classic-primary);
        }

        /* Subtitle Table - Classic */
        #subtitle-editor-section table {
            width: 100%;
            border-collapse: collapse;
            background: var(--classic-bg-secondary);
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--classic-border);
        }

        #subtitle-editor-section th,
        #subtitle-editor-section td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--classic-border);
        }

        #subtitle-editor-section th {
            background: var(--classic-bg-tertiary);
            font-weight: 600;
            color: var(--classic-text-primary);
        }

        #subtitle-editor-section td[contenteditable="true"]:focus {
            background: var(--classic-bg-tertiary);
            outline: 2px solid var(--classic-primary);
            outline-offset: -2px;
        }

        /* File Upload - Classic */
        #dropzone-container {
            border: 2px dashed var(--classic-border);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--classic-bg-secondary);
        }

        #dropzone-container:hover {
            border-color: var(--classic-primary);
            background: var(--classic-bg-tertiary);
        }

        /* PDF Viewer - Classic */
        .pdf-page-item {
            border: 2px solid var(--classic-border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pdf-page-item:hover {
            border-color: var(--classic-primary);
        }

        .pdf-page-item.selected {
            border-color: var(--classic-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Quick Action Buttons - Classic */
        .quick-action-btn {
            flex: 1;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        #reset-settings-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        #reset-settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }

        #clear-memory-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        #clear-memory-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        /* ========================================
           FUTURISTIC THEME - CYBERPUNK & NEON
           ======================================== */

        /* Futuristic Theme Styles */
        .futuristic-theme {
            --neon-cyan: #00f5ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bf00ff;
            --neon-green: #00ff88;
            --neon-yellow: #ffff00;
            --cyber-black: #050508;
            --cyber-dark: #0a0a10;
            --cyber-card: #0f0f18;
            --cyber-border: rgba(0, 245, 255, 0.2);
        }

        .futuristic-theme body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--cyber-black);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(191, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0, 245, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #e0e0ff;
            min-height: 100vh;
            animation: bgPulse 10s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0, 0 0; }
            50% { background-position: 100% 100%, 0% 0%, 50% 50%, 40px 0, 0 40px; }
        }

        .futuristic-theme #app-container {
            background: linear-gradient(180deg, rgba(15, 15, 24, 0.95), rgba(10, 10, 16, 0.98));
            border: 1px solid var(--cyber-border);
            border-radius: 0;
            padding: 0;
            box-shadow:
                0 0 60px rgba(0, 245, 255, 0.15),
                0 0 120px rgba(191, 0, 255, 0.1),
                inset 0 0 100px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .futuristic-theme #app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                var(--neon-cyan),
                var(--neon-purple),
                var(--neon-pink),
                var(--neon-cyan),
                transparent);
            background-size: 200% 100%;
            animation: topBorderGlow 4s linear infinite;
        }

        @keyframes topBorderGlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .futuristic-theme #app-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                var(--neon-purple),
                var(--neon-cyan),
                var(--neon-pink),
                var(--neon-purple),
                transparent);
            background-size: 200% 100%;
            animation: bottomBorderGlow 3s linear infinite reverse;
        }

        @keyframes bottomBorderGlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .futuristic-theme header {
            padding: 1.5rem 2rem;
            margin-bottom: 0;
            border-bottom: 1px solid var(--cyber-border);
            background: linear-gradient(180deg, rgba(0, 245, 255, 0.05), transparent);
        }

        .futuristic-theme header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-cyan));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 5s linear infinite;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            text-transform: uppercase;
        }

        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .futuristic-theme .header-controls {
            display: flex;
            gap: 0.75rem;
        }

        .futuristic-theme .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 0;
            background: rgba(0, 245, 255, 0.1);
            border: 1px solid var(--cyber-border);
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .futuristic-theme .control-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--neon-cyan), transparent);
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .futuristic-theme .control-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .futuristic-theme .control-btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.1);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Futuristic Tabs */
        .futuristic-theme #desktop-tabs {
            background: rgba(10, 10, 16, 0.9);
            border: 1px solid var(--cyber-border);
            border-radius: 0;
            padding: 0;
            margin: 0;
            display: flex;
            border-bottom: 1px solid var(--cyber-border);
            border-left: none;
            border-right: none;
        }

        .futuristic-theme .desktop-tab-btn {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            background: transparent;
            color: #666;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }

        .futuristic-theme .desktop-tab-btn::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--neon-cyan);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .futuristic-theme .desktop-tab-btn:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .futuristic-theme .desktop-tab-btn.active {
            color: var(--neon-cyan);
            background: linear-gradient(180deg, rgba(0, 245, 255, 0.15), transparent);
        }

        .futuristic-theme .desktop-tab-btn.active::before {
            transform: scaleX(1);
        }

        /* Futuristic Form Content */
        .futuristic-theme #view-container {
            padding: 2rem;
        }

        .futuristic-theme input,
        .futuristic-theme select,
        .futuristic-theme textarea {
            background: rgba(15, 15, 24, 0.8);
            border: 1px solid var(--cyber-border);
            color: #e0e0ff;
            border-radius: 0;
            padding: 1rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .futuristic-theme input:focus,
        .futuristic-theme select:focus,
        .futuristic-theme textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow:
                0 0 20px rgba(0, 245, 255, 0.2),
                inset 0 0 20px rgba(0, 245, 255, 0.05);
            background: rgba(15, 15, 24, 0.95);
        }

        .futuristic-theme select option {
            background: var(--cyber-card);
            color: #e0e0ff;
        }

        /* Futuristic Language Grid */
        .futuristic-theme .grid {
            gap: 1rem;
        }

        .futuristic-theme #swap-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.1);
            border: 1px solid var(--cyber-border);
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .futuristic-theme #swap-btn::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1px solid var(--neon-cyan);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .futuristic-theme #swap-btn:hover {
            background: rgba(0, 245, 255, 0.2);
            transform: rotate(180deg);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
        }

        .futuristic-theme #swap-btn:hover::after {
            opacity: 1;
            animation: spinRing 2s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Futuristic Translate Button */
        .futuristic-theme #translate-btn {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(191, 0, 255, 0.2));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 1rem 2.5rem;
            border-radius: 0;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .futuristic-theme #translate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .futuristic-theme #translate-btn:hover::before {
            left: 100%;
        }

        .futuristic-theme #translate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.3), rgba(191, 0, 255, 0.3));

                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" /></svg>
                    </button>
                    <button id="design-toggle" title="Switch Theme">
                        <i class="fas fa-bolt"></i>
                    </button>
                    <button id="theme-toggle" title="Toggle Dark/Light">
                        <i class="fas fa-sun"></i>
                    </button>
                    <button id="settings-btn" data-view="settings" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <div id="desktop-tabs">
                <button type="button" data-mode="text" class="desktop-tab-btn active"><span data-i18n-key="tabText">Text</span></button>
                <button type="button" data-mode="image" class="desktop-tab-btn"><span data-i18n-key="tabImage">Image</span></button>
                <button type="button" data-mode="pdf" class="desktop-tab-btn"><span data-i18n-key="tabPDF">PDF</span></button>
                <button type="button" data-mode="subtitle" class="desktop-tab-btn"><span data-i18n-key="tabSubtitle">Subtitle</span></button>
                <button type="button" data-mode="video" class="desktop-tab-btn"><span data-i18n-key="tabVideo">Video</span></button>
            </div>

            <div id="view-container" class="flex-grow">
                <div id="translation-view">
                    <form id="translate-form" onsubmit="return false;">
                        <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-4 items-center mb-4">
                            <select id="source_lang" name="source_lang" class="w-full"></select>
                            <button type="button" id="swap-btn" title="Swap languages">
                                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" /></svg>
                            </button>
                            <select id="target_lang" name="target_lang" class="w-full"></select>
                        </div>

                        <div class="relative mb-4">
                            <div id="text-input-section">
                                <textarea id="text-input" name="text" maxlength="5000" placeholder="Enter text to translate..." class="w-full h-40 resize-none"></textarea>
                                <span id="char-counter" class="absolute bottom-2 right-3 text-xs">0 / 5000</span>
                            </div>

                            <div id="youtube-input-section" class="hidden mb-4 p-4 rounded-lg space-y-3">
                                <label class="block text-sm font-medium" data-i18n-key="youtubeSectionTitle">Load from YouTube URL</label>
                                <div class="flex flex-col sm:flex-row gap-2">
                                    <input type="text" id="youtube-url-input" placeholder="Enter YouTube Video URL..." class="w-full flex-grow">
                                    <input type="text" id="youtube-lang-input" value="en" placeholder="lang" class="sm:w-20 text-center">
                                    <button type="button" id="fetch-youtube-subs-btn" class="flex items-center justify-center">
                                       <span id="fetch-youtube-btn-text" data-i18n-key="youtubeFetchBtn">Fetch</span>
                                       <svg id="fetch-youtube-btn-spinner" class="spinner w-5 h-5 ml-2 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    </button>
                                </div>
                            </div>

                            <div id="file-input-section" class="hidden">
                                <div id="dropzone-container" class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-lg cursor-pointer p-2">
                                    <div id="dropzone-prompt" class="flex flex-col items-center justify-center text-center p-4">
                                        <svg class="w-8 h-8 mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/></svg>
                                        <p class="mb-2 text-sm"><span class="font-semibold" data-i18n-key="fileDragDrop"></span> <span data-i18n-key="fileOr"></span></p>
                                        <button type="button" id="choose-file-btn" class="px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700" data-i18n-key="fileChooseBtn"></button>
                                        <p id="file-upload-hint" class="text-xs mt-2"></p>
                                    </div>
                                    <div id="file-preview-container" class="hidden relative w-full h-full flex items-center justify-center">
                                        <img id="image-preview" class="max-w-full max-h-full object-contain rounded-md" alt="Image preview">
                                        <button type="button" id="remove-file-btn" class="absolute top-1 right-1 p-1.5 rounded-full bg-black/50 hover:bg-red-600 text-white">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>
                                </div>
                                <input id="file-upload" name="file" type="file" class="hidden" />
                            </div>
                        </div>

                        <div id="pdf-viewer-section" class="hidden mb-4 p-4 rounded-lg space-y-4">
                            <div class="flex flex-wrap gap-4 justify-between items-center pb-3 border-b">
                                <h3 class="text-lg font-semibold" data-i18n-key="pdfSelectPagesTitle"></h3>
                                <div class="flex items-center gap-2">
                                     <button type="button" id="select-all-pages-btn" class="px-3 py-1 text-sm font-medium rounded-md" data-i18n-key="pdfSelectAll"></button>
                                     <button type="button" id="deselect-all-pages-btn" class="px-3 py-1 text-sm font-medium rounded-md" data-i18n-key="pdfDeselectAll"></button>
                                </div>
                            </div>
                            <div id="pdf-page-viewer" class="max-h-[30rem] overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4 p-2 rounded-md"></div>
                             <div class="pt-3 border-t flex flex-wrap gap-x-4 gap-y-2 justify-between items-center">
                                <span id="page-selection-counter" class="text-sm font-medium"></span>
                                <div class="flex items-center">
                                    <input id="combine-pages-checkbox" name="combine_pages" type="checkbox" class="h-4 w-4 rounded">
                                    <label for="combine-pages-checkbox" class="ms-2 text-sm font-medium" data-i18n-key="pdfCombinePages"></label>
                                </div>
                            </div>
                        </div>

                        <div id="subtitle-editor-section" class="hidden mb-4 p-4 rounded-lg space-y-4">
                            <div class="flex flex-wrap gap-4 justify-between items-center pb-3 border-b">
                                <h3 class="text-lg font-semibold" data-i18n-key="subtitleEditorTitle"></h3>
                                <div class="flex items-center gap-2">
                                     <button type="button" id="export-btn" disabled class="px-3 py-1 text-sm font-medium rounded-md disabled:opacity-50" data-i18n-key="subtitleExportBtnLabel"></button>
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-4 items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <label for="subtitle-batch-size" class="text-sm font-medium" data-i18n-key="subtitleLinesPerRequest"></label>
                                    <input type="number" id="subtitle-batch-size" value="100" min="1" max="500" class="w-20">
                                </div>
                                <div class="flex items-center gap-2">
                                    <button type="button" id="break-lines-toggle-btn" disabled class="px-3 py-1 text-sm font-medium rounded-md disabled:opacity-50" data-i18n-key="subtitleBreakLinesBtnLabel"></button>
                                    <button type="button" id="find-replace-toggle-btn" disabled class="px-3 py-1 text-sm font-medium rounded-md disabled:opacity-50" data-i18n-key="subtitleFindReplaceBtnLabel"></button>
                                </div>
                            </div>

                            <div class="max-h-[30rem] overflow-y-auto relative">
                                <table class="w-full text-sm">
                                    <thead class="sticky top-0 z-10">
                                        <tr>
                                            <th class="w-12 text-center" data-i18n-key="subtitleTableHeaderNum"></th>
                                            <th class="w-48" data-i18n-key="subtitleTableHeaderTime"></th>
                                            <th data-i18n-key="subtitleTableHeaderOrig"></th>
                                            <th data-i18n-key="subtitleTableHeaderTrans"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="subtitle-table-body"></tbody>
                                </table>
                            </div>
                        </div>

                        <div id="progress-container" class="hidden">
                            <div class="flex justify-between items-center mb-2">
                                <span id="progress-label" class="text-sm font-medium" data-i18n-key="progressLabelTranslating"></span>
                                <span id="progress-percentage" class="text-sm font-bold">0%</span>
                            </div>
                            <div class="w-full progress-bar">
                               <div id="progress-bar-inner" class="progress-bar-inner" style="width: 0%"></div>
                            </div>
                            <button type="button" id="cancel-translation-btn" class="mt-4 text-sm font-medium" data-i18n-key="progressCancel"></button>
                        </div>

                        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-4">
                            <button type="submit" id="translate-btn" class="flex items-center justify-center gap-2">
                                <span id="translate-btn-text" data-i18n-key="translateBtn">Translate</span>
                                <svg id="translate-btn-spinner" class="spinner w-5 h-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            </button>
                            <div id="error-display" class="text-sm text-red-500 dark:text-red-400 text-center sm:text-left"></div>
                        </div>

                        <div id="main-output-section" class="mt-6">
                           <div class="relative">
                               <textarea id="output" readonly placeholder="Translation will appear here..." class="w-full h-48 resize-none"></textarea>
                               <div class="absolute top-2 right-2 flex flex-col gap-2">
                                  <button type="button" id="copy-btn" disabled class="action-btn p-2 rounded-md transition-colors disabled:opacity-50">
                                      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
                                  </button>
                                  <button type="button" id="export-text-btn" disabled class="action-btn p-2 rounded-md transition-colors disabled:opacity-50">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /> </svg>
                                  </button>
                               </div>
                           </div>
                           <div id="enhancements-toolbar" class="hidden opacity-0 -translate-y-2 mt-4 p-2 rounded-lg flex flex-wrap items-center justify-center gap-2">
                               <span class="text-sm font-semibold mr-2" data-i18n-key="refineToolbarTitle"></span>
                               <button data-action="shorten" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="refineShorten"></button>
                               <button data-action="expand" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="refineExpand"></button>
                               <button data-action="summarize" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="refineSummarize"></button>
                               <span class="border-l h-6 mx-2"></span>
                               <span class="text-sm font-semibold mr-2" data-i18n-key="styleToolbarTitle"></span>
                               <button data-action="formal" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="styleFormal"></button>
                               <button data-action="informal" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="styleInformal"></button>
                               <button data-action="poetic" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="stylePoetic"></button>
                               <button data-action="simplify" class="enhancement-btn text-sm px-3 py-1 rounded-md" data-i18n-key="styleSimplify"></button>
                           </div>
                        </div>
                    </form>
                </div>

                <div id="settings-view" class="hidden">
                    <h2>Settings</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="model" class="block text-sm font-medium mb-1" data-i18n-key="settingsModel"></label>
                            <select id="model" name="model" class="w-full"></select>
                        </div>
                        <div>
                            <label for="job_field" class="block text-sm font-medium mb-1" data-i18n-key="settingsSpecialization"></label>
                            <select id="job_field" name="job_field" class="w-full"></select>
                        </div>
                        <div>
                            <label for="translation_tone" class="block text-sm font-medium mb-1" data-i18n-key="settingsTone"></label>
                            <select id="translation_tone" name="translation_tone" class="w-full"></select>
                        </div>
                        <div id="custom-tone-container" class="hidden">
                            <label for="custom-tone-input" class="block text-sm font-medium mb-1" data-i18n-key="settingsCustomToneLabel"></label>
                            <input id="custom-tone-input" type="text" class="w-full">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">
                         <div>
                             <label for="temperature" class="block text-sm font-medium mb-1" data-i18n-key="settingsCreativity"></label>
                             <div class="flex items-center gap-3">
                                 <input id="temperature" name="temperature" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                                 <span id="temperature-value" class="font-mono text-sm">0.7</span>
                             </div>
                         </div>
                         <div>
                             <label for="request_delay" class="block text-sm font-medium mb-1" data-i18n-key="settingsRequestDelay"></label>
                             <input id="request_delay" name="request_delay" type="number" min="0" step="0.5" value="4" class="w-full">
                         </div>
                    </div>
                    <div class="mt-6">
                        <label for="api_key" class="block text-sm font-medium mb-1" data-i18n-key="settingsApiKey"></label>
                        <textarea id="api_key" name="api_key" rows="3" class="w-full font-mono"></textarea>
                        <p class="text-xs mt-1" data-i18n-key="settingsApiKeyHint"></p>
                    </div>
                    <div class="mt-6 space-y-4 pt-4 border-t">
                        <div class="flex items-center">
                            <input id="use-proxy-checkbox" type="checkbox" class="h-4 w-4 rounded">
                            <label for="use-proxy-checkbox" class="ms-3 text-sm font-medium" data-i18n-key="settingsUseProxy"></label>
                        </div>
                        <div class="flex items-center">
                            <input id="save-settings-checkbox" type="checkbox" class="h-4 w-4 rounded">
                            <label for="save-settings-checkbox" class="ms-3 text-sm font-medium" data-i18n-key="settingsSave"></label>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <button id="reset-settings-btn" class="quick-action-btn">
                            <i class="fas fa-undo"></i>
                            Reset Translation Settings
                        </button>
                        <button id="clear-memory-btn" class="quick-action-btn">
                            <i class="fas fa-trash-alt"></i>
                            Clear Browser Memory
                        </button>
                    </div>

                    <div class="mt-6 pt-6 border-t">
                        <button id="log-toggle-btn" class="w-full text-left font-semibold mb-2">
                            <i class="fas fa-chevron-down w-4 inline-block transform transition-transform"></i> <span data-i18n-key="logTitle"></span>
                        </button>
                        <div id="log-viewer" class="max-h-0 overflow-hidden transition-all">
                            <div id="log-content" class="h-48 overflow-y-auto">
                                <div id="log-output"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>Created with <i class="fas fa-heart text-red-500 mx-1"></i> by YEBEKHE</p>
            </div>
        </div>
    </main>

    <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 flex justify-around items-center h-[70px] shadow-lg">
        <button type="button" data-mode="text" class="mobile-nav-btn active">
            <i class="fas fa-file-alt"></i>
            <span data-i18n-key="tabText"></span>
        </button>
        <button type="button" data-mode="image" class="mobile-nav-btn">
            <i class="fas fa-image"></i>
            <span data-i18n-key="tabImage"></span>
        </button>
        <button type="button" data-mode="pdf" class="mobile-nav-btn">
            <i class="fas fa-file-pdf"></i>
            <span data-i18n-key="tabPDF"></span>
        </button>
        <button type="button" data-mode="subtitle" class="mobile-nav-btn">
            <i class="fas fa-closed-captioning"></i>
            <span data-i18n-key="tabSubtitle"></span>
        </button>
        <button type="button" data-mode="video" class="mobile-nav-btn">
            <i class="fas fa-video"></i>
            <span data-i18n-key="tabVideo"></span>
        </button>
        <button type="button" data-view="settings" class="mobile-nav-btn">
            <i class="fas fa-cog"></i>
            <span data-i18n-key="advSettingsBtn"></span>
        </button>
    </div>

    <div id="how-to-use-modal" class="hidden">
        <div>
            <div class="flex justify-between items-center p-4 border-b">
                <h2 id="how-to-use-title" class="text-xl font-bold" data-i18n-key="howToUseModalTitle"></h2>
                <button id="how-to-use-close-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="how-to-use-content"></div>
        </div>
    </div>

</body>
